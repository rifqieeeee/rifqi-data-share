<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Nilai Mahasiswa</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(135deg,#dbeafe,#fce7f3);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:900px;
    background:white;
    border-radius:22px;
    padding:30px;
    box-shadow:0 20px 50px rgba(0,0,0,.12);
}

h1{
    text-align:center;
    color:#1e3a8a;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:30px;
}

.menu-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:18px;
}

.menu-card{
    display:block;
    text-decoration:none;
    color:inherit;
    background:#f8fafc;
    border:1px solid #e5e7eb;
    border-radius:18px;
    padding:20px;
    transition:.25s;
}

.menu-card:hover{
    transform:translateY(-4px);
    box-shadow:0 12px 25px rgba(0,0,0,.08);
    border-color:#2563eb;
}

.menu-title{
    font-size:20px;
    font-weight:bold;
    color:#1e40af;
    margin-bottom:8px;
}

.menu-desc{
    color:#666;
    line-height:1.5;
}

.badge{
    display:inline-block;
    margin-top:12px;
    background:#dbeafe;
    color:#1d4ed8;
    padding:6px 12px;
    border-radius:999px;
    font-size:13px;
    font-weight:bold;
}

.footer{
    text-align:center;
    margin-top:30px;
    color:#888;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

    <h1>Portal Nilai Mahasiswa</h1>

    <p class="subtitle">
        Silakan pilih mata kuliah untuk melihat hasil penilaian.
    </p>

    <div class="menu-grid">

        <a href="https://rifqi-data-share.vercel.app/nilaipbo" class="menu-card">
            <div class="menu-title">Penilaian Project PBO 2026</div>
            <div class="menu-desc">
                Cek nilai Project Pemrograman Berorientasi Objek berdasarkan NIM anggota kelompok.
            </div>
            <div class="badge">Buka Halaman</div>
        </a>
        
    </div>

</div>

</body>
</html>
